name: Public Endpoint Monitor

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-endpoint-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Website, TLS, metadata, and packages
    if: github.event_name == 'workflow_dispatch' || vars.PUBLIC_ENDPOINT_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test public endpoints
        shell: pwsh
        run: |
          ./Build/Test-PublicEndpoints.ps1 `
              -ReportPath "Build/ValidationReports/Public-Endpoint-Monitor.txt" `
              -MinimumCertificateDays 21

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-endpoint-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: Build/ValidationReports/Public-Endpoint-Monitor.txt
          if-no-files-found: warn
          retention-days: 14
