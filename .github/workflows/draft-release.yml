name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag, for example v0.97.0 or v0.97.1"
        required: true
        type: string
      qualified_commit_sha:
        description: "Exact 40-character commit SHA qualified on the trusted Windows VM"
        required: true
        type: string
      package_url:
        description: "HTTPS URL of the already validated Production or Test ZIP"
        required: true
        default: "https://jasonquery.org/JasonQueryUpdate/JasonQuery64.zip"
        type: string
      package_sha256:
        description: "Expected SHA-256 from the trusted Windows VM"
        required: true
        type: string
      confirm_draft:
        description: "Create a draft release only; publishing remains manual"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: draft-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: Create verified draft release
    if: inputs.confirm_draft == true
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify existing tag and package, then create draft
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\Build\New-DraftRelease.ps1 `
              -TagName "${{ inputs.tag_name }}" `
              -ExpectedCommitSha "${{ inputs.qualified_commit_sha }}" `
              -PackageUrl "${{ inputs.package_url }}" `
              -PackageSha256 "${{ inputs.package_sha256 }}" `
              -Repository "${{ github.repository }}"
