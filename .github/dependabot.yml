version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/JasonLibrary"
      - "/JasonQuery"
      - "/Tests/JasonLibrary.Tests"
      - "/Tests/JasonQuery.IntegrationTests"
      - "/Tests/JasonQuery.Tests"
    schedule:
      interval: "monthly"
      time: "06:20"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      routine-nuget-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-nuget-updates:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:40"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      routine-action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-action-updates:
        patterns:
          - "*"
        update-types:
          - "major"
