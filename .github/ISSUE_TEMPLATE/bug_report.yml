name: Bug Report
description: Report a reproducible problem in JasonQuery.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Security vulnerabilities must not be reported here.** Use GitHub Private Vulnerability Reporting from the Security tab instead. Do not attach credentials, recovery keys, production databases, customer data, or unreviewed sensitive logs.

  - type: checkboxes
    id: existing_issue
    attributes:
      label: Existing issue
      description: Please check whether the same problem has already been reported.
      options:
        - label: I searched the existing issues and did not find the same problem.
          required: true

  - type: input
    id: version
    attributes:
      label: JasonQuery version or commit
      description: Enter the affected release version or commit SHA when known.
      placeholder: "Example: v0.96.0 or abc1234"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Include edition/version/build when known.
      placeholder: "Example: Windows 11 24H2 x64"
    validations:
      required: true

  - type: dropdown
    id: database_platform
    attributes:
      label: Database platform
      description: Select the external database involved, or choose Not database-specific.
      options:
        - Not database-specific
        - Oracle
        - PostgreSQL
        - SQL Server
        - MySQL
        - Unsure
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What happened?
      placeholder: Describe the observed behavior and any relevant error message.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect JasonQuery to do?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start JasonQuery...
        2. Connect to...
        3. Run/open/select...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add sanitized screenshots, SQL, logs, or other context only when it helps reproduction. Remove credentials and sensitive production data first.
    validations:
      required: false
